name: Deploy para produção

# Dispara em push de QUALQUER branch (não só main) — mesma convenção usada no meu-coach:
# cada rodada de mudanças pode ir pra produção numa branch própria, sem depender da main.
on:
  push: {}
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar a branch/commit implantado
        run: echo "Deploy de '${{ github.ref_name }}' (commit ${{ github.sha }})"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Empacotar
        run: tar --exclude='.next/cache' -czf calculadora3d.tar.gz .next public package.json package-lock.json next.config.ts prisma/schema.prisma prisma/migrations

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Mantém os 10 backups mais recentes e, dos mais antigos, um por dia por 30 dias.
      - name: Backup do banco de produção
        run: |
          BRANCH_SEGURA=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_-' '-')
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cp /opt/calculadora3d/data/prod.db /opt/calculadora3d/data/backup-\$(date +%Y%m%d-%H%M%S)-ci-${BRANCH_SEGURA}.db 2>/dev/null || true; cd /opt/calculadora3d/data && ls -t backup-*.db 2>/dev/null | tail -n +11 | awk '{ if (seen[substr(\$0, 8, 8)]++) print }' | xargs -r rm -f; find /opt/calculadora3d/data -maxdepth 1 -name 'backup-*.db' -mtime +30 -delete"

      - name: Enviar pacote
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes calculadora3d.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Extrair, instalar dependências, migrar banco e reiniciar
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "tar -xzf /tmp/calculadora3d.tar.gz -C /opt/calculadora3d && cd /opt/calculadora3d && npm install --omit=dev && npx prisma generate && npx prisma migrate deploy && docker compose restart"

      # O container instala o openssl a cada boot antes de subir o Next, então
      # pode levar mais de um minuto: tenta por até 3 min antes de dar falha.
      - name: Verificar se a produção respondeu
        run: |
          for i in $(seq 1 18); do
            if curl -sf -o /dev/null https://calculadora3d.silaratur.cloud/; then echo "OK: produção respondeu (tentativa $i)"; exit 0; fi
            sleep 10
          done
          echo "FALHA: produção não respondeu em 3 minutos"
          exit 1
