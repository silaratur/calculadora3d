name: Deploy para produção

# Dispara em push de QUALQUER branch (não só main) — mesma convenção usada no meu-coach:
# cada rodada de mudanças pode ir pra produção numa branch própria, sem depender da main.
on:
  push: {}
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar a branch/commit implantado
        run: echo "Deploy de '${{ github.ref_name }}' (commit ${{ github.sha }})"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Empacotar
        run: tar -czf calculadora3d.tar.gz .next public package.json package-lock.json next.config.ts prisma/schema.prisma prisma/migrations

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup do banco de produção
        run: |
          BRANCH_SEGURA=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_-' '-')
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cp /opt/calculadora3d/data/prod.db /opt/calculadora3d/data/backup-\$(date +%Y%m%d-%H%M%S)-ci-${BRANCH_SEGURA}.db 2>/dev/null || true"

      - name: Enviar pacote
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes calculadora3d.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/"

      - name: Extrair, instalar dependências, migrar banco e reiniciar
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "tar -xzf /tmp/calculadora3d.tar.gz -C /opt/calculadora3d && cd /opt/calculadora3d && npm install --omit=dev && npx prisma generate && npx prisma migrate deploy && docker compose restart"

      - name: Verificar se a produção respondeu
        run: |
          sleep 5
          curl -sf -o /dev/null https://calculadora3d.silaratur.cloud/ && echo "OK: produção respondeu" || (echo "FALHA: produção não respondeu" && exit 1)
